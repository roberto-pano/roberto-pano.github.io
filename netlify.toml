[build]
  command = "npm run build:web"
  publish = "site/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    "Content-Type" = "application/javascript"
    "X-Content-Type-Options" = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    "Content-Type" = "application/javascript"
    "X-Content-Type-Options" = "nosniff"
