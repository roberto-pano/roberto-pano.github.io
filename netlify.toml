[build]
  command = "npm run build:web"
  publish = "site/dist"

# Asset MIME types
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css"
    X-Content-Type-Options = "nosniff"

# This redirect should be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
    "X-Content-Type-Options" = "nosniff"
