name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        # Use the major tag to avoid occasional missing patch tags; change to a specific
        # minor/patch tag if you need an exact version (check the action repo for tags).
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --verbose --redact
