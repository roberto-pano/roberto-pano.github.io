name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (container runner)
        # Use GitHub's container execution for the gitleaks image so the runner doesn't need
        # the local `docker` binary (prevents exit code 125 when docker isn't available).
        # The workspace is mounted at /github/workspace inside the container.
        uses: docker://zricethezav/gitleaks:8.24.3
        with:
          args: detect --source=/github/workspace --report-format=json --report=/github/workspace/gitleaks-report.json --redact --verbose
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            .gitleaks_exit

      - name: Fail if Gitleaks found secrets
        if: always()
        run: |
          if [ -f .gitleaks_exit ]; then
            code=$(cat .gitleaks_exit)
            if [ "$code" != "0" ]; then
              echo "Gitleaks detected secrets (exit code=$code). See artifact 'gitleaks-report' for details."
              exit 1
            else
              echo "No leaks detected by gitleaks."
            fi
          else
            echo "No gitleaks exit code found; failing to be safe."
            exit 1
          fi
