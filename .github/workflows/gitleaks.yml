name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (download binary)
        # Download the latest gitleaks release binary for Linux amd64 via the GitHub API,
        # extract it, and run the `detect` command against the checked-out repository.
        # This avoids relying on a specific container tag that may not exist on Docker Hub.
        run: |
          set -euxo pipefail
          # Ensure we always write an exit code file for downstream steps. rc defaults to 2 (unexpected failure).
          rc=2
          trap 'echo "$rc" > "$GITHUB_WORKSPACE/.gitleaks_exit" || true' EXIT
          # ensure jq is available
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          echo "Fetching latest gitleaks release metadata..."
          rel_json=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest)
          asset_url=$(echo "$rel_json" | jq -r '.assets[] | select(.name|test("(linux|Linux).*(amd64|x86_64)|linux-amd64")) | .browser_download_url' | head -n1)
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Could not find a Linux amd64 asset in the latest gitleaks release. Falling back to trying 'gitleaks-linux-amd64' asset name..."
            asset_url=$(echo "$rel_json" | jq -r '.assets[] | select(.name|test("gitleaks.*linux.*amd64|gitleaks.*linux.*x86_64")) | .browser_download_url' | head -n1)
          fi
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No suitable gitleaks release asset found. Exiting with failure."
            rc=3
            exit 1
          fi

          echo "Downloading gitleaks asset: $asset_url"
          curl -L --retry 3 --retry-delay 2 "$asset_url" -o /tmp/gitleaks_asset

          mkdir -p /tmp/gitleaks && cd /tmp/gitleaks
          # try tar extraction, otherwise unzip
          if file /tmp/gitleaks_asset | grep -qi 'gzip\|x86-64\|tar'; then
            tar xzf /tmp/gitleaks_asset || true
          else
            unzip -q /tmp/gitleaks_asset || true
          fi

          # find the binary and make it executable
          bin=$(find . -type f -iname 'gitleaks*' -perm /111 | head -n1 || true)
          if [ -z "$bin" ]; then
            bin=$(find . -type f -iname 'gitleaks*' | head -n1 || true)
          fi
          if [ -z "$bin" ]; then
            echo "gitleaks binary not found after extraction" >&2
            ls -la
            rc=4
            exit 1
          fi
          chmod +x "$bin"
          mv "$bin" /usr/local/bin/gitleaks || mv "$bin" "$GITHUB_WORKSPACE/gitleaks"

          echo "Running gitleaks detect against workspace..."
          set +e
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source="$GITHUB_WORKSPACE" --report-format=json --report="$GITHUB_WORKSPACE/gitleaks-report.json" --redact --verbose
            rc=$?
          else
            "$GITHUB_WORKSPACE/gitleaks" detect --source="$GITHUB_WORKSPACE" --report-format=json --report="$GITHUB_WORKSPACE/gitleaks-report.json" --redact --verbose
            rc=$?
          fi
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            .gitleaks_exit

      - name: Fail if Gitleaks found secrets
        if: always()
        run: |
          if [ -f .gitleaks_exit ]; then
            code=$(cat .gitleaks_exit)
            if [ "$code" != "0" ]; then
              echo "Gitleaks detected secrets (exit code=$code). See artifact 'gitleaks-report' for details."
              exit 1
            else
              echo "No leaks detected by gitleaks."
            fi
          else
            echo "No gitleaks exit code found; failing to be safe."
            exit 1
          fi
