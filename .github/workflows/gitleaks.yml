name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (download binary)
        # Download the latest gitleaks release binary for Linux amd64 via the GitHub API,
        # extract it, and run the `detect` command against the checked-out repository.
        # This avoids relying on a specific container tag that may not exist on Docker Hub.
        run: |
          set -euxo pipefail
          # Ensure we always write an exit code file for downstream steps. rc defaults to 2 (unexpected failure).
          rc=2
          trap 'echo "$rc" > "$GITHUB_WORKSPACE/.gitleaks_exit" || true' EXIT
          # ensure jq is available
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          echo "Fetching latest gitleaks release metadata..."
          rel_json=$(curl -sS https://api.github.com/repos/gitleaks/gitleaks/releases/latest)

          # Prefer any asset whose name mentions linux and a common x86_64/x64 identifier.
          asset_url=$(echo "$rel_json" | jq -r '.assets[] | select((.name|ascii_downcase|test("linux")) and (.name|ascii_downcase|test("x64|x86_64|amd64|_x64|x86"))) | .browser_download_url' | head -n1)

          # If that didn't find anything, accept any linux asset (common fallback) with an octet-stream content type
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            asset_url=$(echo "$rel_json" | jq -r '.assets[] | select((.name|ascii_downcase|test("linux")) and (.content_type=="application/octet-stream")) | .browser_download_url' | head -n1)
          fi

          # Final fallback: construct the likely linux x64 asset name from the tag (e.g. gitleaks_8.29.0_linux_x64.tar.gz)
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            tag_name=$(echo "$rel_json" | jq -r '.tag_name')
            tag_no_v=${tag_name#v}
            constructed_url="https://github.com/gitleaks/gitleaks/releases/download/${tag_name}/gitleaks_${tag_no_v}_linux_x64.tar.gz"
            echo "Attempting constructed asset URL: $constructed_url"

            # Quick check if constructed URL exists (HTTP 200)
            if curl -sfI "$constructed_url" >/dev/null 2>&1; then
              asset_url="$constructed_url"
            else
              echo "No suitable gitleaks release asset found after trying flexible patterns and constructed fallback."
              rc=3
              exit 1
            fi
          fi

          echo "Downloading gitleaks asset: $asset_url"
          curl -L --retry 3 --retry-delay 2 "$asset_url" -o /tmp/gitleaks_asset

          mkdir -p /tmp/gitleaks && cd /tmp/gitleaks
          # try tar extraction, otherwise unzip
          if file /tmp/gitleaks_asset | grep -qi 'gzip\|x86-64\|tar'; then
            tar xzf /tmp/gitleaks_asset || true
          else
            unzip -q /tmp/gitleaks_asset || true
          fi

          # find the binary and make it executable
          bin=$(find . -type f -iname 'gitleaks*' -perm /111 | head -n1 || true)
          if [ -z "$bin" ]; then
            bin=$(find . -type f -iname 'gitleaks*' | head -n1 || true)
          fi
          if [ -z "$bin" ]; then
            echo "gitleaks binary not found after extraction" >&2
            ls -la
            rc=4
            exit 1
          fi
          chmod +x "$bin"
          mv "$bin" /usr/local/bin/gitleaks || mv "$bin" "$GITHUB_WORKSPACE/gitleaks"

          echo "Running gitleaks detect against workspace..."
          set +e
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source="$GITHUB_WORKSPACE" --report-format=json --report="$GITHUB_WORKSPACE/gitleaks-report.json" --redact --verbose
            rc=$?
          else
            "$GITHUB_WORKSPACE/gitleaks" detect --source="$GITHUB_WORKSPACE" --report-format=json --report="$GITHUB_WORKSPACE/gitleaks-report.json" --redact --verbose
            rc=$?
          fi
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            .gitleaks_exit

      - name: Fail if Gitleaks found secrets
        if: always()
        run: |
          if [ -f .gitleaks_exit ]; then
            code=$(cat .gitleaks_exit)
            if [ "$code" != "0" ]; then
              echo "Gitleaks detected secrets (exit code=$code). See artifact 'gitleaks-report' for details."
              exit 1
            else
              echo "No leaks detected by gitleaks."
            fi
          else
            echo "No gitleaks exit code found; failing to be safe."
            exit 1
          fi
