name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        # The action requires a GitHub token to scan pull requests. Pass the automatically
        # created token via `secrets.GITHUB_TOKEN`. Keep flags as args if the action accepts them.
        uses: zricethezav/gitleaks-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          args: --verbose --redact
