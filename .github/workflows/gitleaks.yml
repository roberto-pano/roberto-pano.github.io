name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Run Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (CLI via Docker)
        # Use the gitleaks CLI (Docker image) against the checked-out repository to avoid
        # the Action's license enforcement and GitHub API rate-limit issues. This runs the
        # scanner locally against the workspace and writes a JSON report at the repo root.
        # We capture the exit code to .gitleaks_exit, upload the report, and then fail the
        # job in a separate step if leaks were detected.
        run: |
          set +e
          echo "Running gitleaks docker scan..."
          docker run --rm -v "${{ github.workspace }}:/src" zricethezav/gitleaks:8.24.3 detect \
            --source="/src" --report-format=json --report=/src/gitleaks-report.json --redact --verbose
          echo "$?" > .gitleaks_exit
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            .gitleaks_exit

      - name: Fail if Gitleaks found secrets
        if: always()
        run: |
          if [ -f .gitleaks_exit ]; then
            code=$(cat .gitleaks_exit)
            if [ "$code" != "0" ]; then
              echo "Gitleaks detected secrets (exit code=$code). See artifact 'gitleaks-report' for details."
              exit 1
            else
              echo "No leaks detected by gitleaks."
            fi
          else
            echo "No gitleaks exit code found; failing to be safe."
            exit 1
          fi
