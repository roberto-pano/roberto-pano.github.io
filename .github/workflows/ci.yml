name: CI (ECR + OIDC + Scan + Sign)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cosmic-pony-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (assume role)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # set this in your repo secrets (arn:aws:iam::123456789012:role/YourRole)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          # We don't need the docker credential outputs across jobs in this
          # workflow, so keep the Docker password masked in logs for safety.
          mask-password: true

      - name: Get AWS account ID
        id: get-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" --region ${{ env.AWS_REGION }} || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" --region ${{ env.AWS_REGION }}

      - name: Build and tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker build --pull -t ${IMAGE_NAME} .
          echo "Pushing ${IMAGE_NAME}"
          docker push ${IMAGE_NAME}

      - name: Scan pushed image with Trivy (json + table)
        # Produce a JSON report for artifact upload and a human table for logs.
        run: |
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # Mount the workspace so the container can write the JSON report to the host
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/work" -w /work ghcr.io/aquasecurity/trivy:0.67.2 image --format json --output /work/trivy-report.json ${IMAGE} || true
          # Print a concise table of HIGH/CRITICAL vulnerabilities for quick view
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.67.2 image --format table --severity CRITICAL,HIGH ${IMAGE} || true

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Fail on CRITICAL/HIGH vulnerabilities
        if: always()
        run: |
          # Exit with non-zero if any HIGH or CRITICAL vulnerabilities are present
          if [ -f trivy-report.json ]; then
            if jq -e '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL" or .Severity=="HIGH")' trivy-report.json > /dev/null; then
              echo "Found CRITICAL/HIGH vulnerabilities — failing job"
              jq '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL" or .Severity=="HIGH") | {VulnerabilityID:.VulnerabilityID,Package:.PkgName,Installed:.InstalledVersion,Fixed:.FixedVersion,Severity:.Severity,Title:.Title}' trivy-report.json
              exit 1
            else
              echo "No CRITICAL/HIGH vulnerabilities found"
            fi
          else
            echo "No trivy report found; skipping vulnerability failure step"
          fi

      - name: Sign image with Cosign (keyless, digest-pinned)
        # Use a digest-pinned cosign container image. Pull the pushed image, sign its digest (not the tag),
        # and mount the Docker credentials so cosign can authenticate to ECR.
        run: |
          set -euo pipefail
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          COSIGN_DIGEST=ghcr.io/sigstore/cosign/cosign@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b
          echo "Pulling ${IMAGE} to ensure the registry digest is available"
          docker pull ${IMAGE}
          # Get the canonical digest reference (repo@sha256:...)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE} || true)
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "<no value>" ]; then
            echo "Failed to obtain image digest for ${IMAGE}" >&2
            docker images --digests ${IMAGE} || true
            exit 1
          fi
          echo "Signing ${DIGEST} using ${COSIGN_DIGEST}"
          # Get an ECR auth token and pass it to cosign so it can access the registry.
          # We avoid printing the token; it will be passed as an argument to the cosign container.
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          # Request a GitHub Actions OIDC ID token for sigstore so cosign can perform non-interactive keyless signing.
          # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN are provided by the Actions runner
          # when the workflow has 'id-token: write' permission.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint variables not available; cannot obtain ID token for cosign" >&2
            exit 1
          fi
          # The token endpoint returns JSON like {"value":"<token>"} — extract the raw token value.
          RAW_ID_RESPONSE=$(curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")
          # Try to extract with jq; fall back to python if jq missing
          ID_TOKEN=$(printf '%s' "${RAW_ID_RESPONSE}" | jq -r '.value' 2>/dev/null || python - <<'PY'
import sys, json
try:
    obj = json.load(sys.stdin)
    print(obj.get('value',''))
except Exception:
    sys.exit(0)
PY
)
          if [ -z "${ID_TOKEN}" ]; then
            echo "Failed to obtain raw ID token for cosign; response was: ${RAW_ID_RESPONSE}" >&2
            exit 1
          fi
          # Use registry username 'AWS' with the ECR password per Amazon ECR auth flow
          docker run --rm ${COSIGN_DIGEST} sign --identity-token "${ID_TOKEN}" --registry-username AWS --registry-password "${ECR_PASSWORD}" ${DIGEST}

      - name: Pull and run CI inside the signed image
        run: |
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker pull ${IMAGE}
          # run the same CI commands that the Dockerfile CMD would run (pnpm inside image)
          docker run --rm ${IMAGE} sh -c "pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/

