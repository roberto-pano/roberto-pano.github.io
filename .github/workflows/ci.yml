name: CI (ECR + OIDC + Scan + Sign)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cosmic-pony-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (assume role)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # set this in your repo secrets (arn:aws:iam::123456789012:role/YourRole)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          # We don't need the docker credential outputs across jobs in this
          # workflow, so keep the Docker password masked in logs for safety.
          mask-password: true

      - name: Get AWS account ID
        id: get-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" --region ${{ env.AWS_REGION }} || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" --region ${{ env.AWS_REGION }}

      - name: Build and tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker build --pull -t ${IMAGE_NAME} .
          echo "Pushing ${IMAGE_NAME}"
          docker push ${IMAGE_NAME}

      - name: Scan pushed image with Trivy (json + table)
        # Produce a JSON report for artifact upload and a human table for logs.
        run: |
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # Mount the workspace so the container can write the JSON report to the host
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/work" -w /work ghcr.io/aquasecurity/trivy:0.67.2 image --format json --output /work/trivy-report.json ${IMAGE} || true
          # Print a concise table of HIGH/CRITICAL vulnerabilities for quick view
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.67.2 image --format table --severity CRITICAL,HIGH ${IMAGE} || true

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Fail on CRITICAL/HIGH vulnerabilities
        if: always()
        run: |
          # Exit with non-zero if any HIGH or CRITICAL vulnerabilities are present
          if [ -f trivy-report.json ]; then
            if jq -e '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL" or .Severity=="HIGH")' trivy-report.json > /dev/null; then
              echo "Found CRITICAL/HIGH vulnerabilities — failing job"
              jq '.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL" or .Severity=="HIGH") | {VulnerabilityID:.VulnerabilityID,Package:.PkgName,Installed:.InstalledVersion,Fixed:.FixedVersion,Severity:.Severity,Title:.Title}' trivy-report.json
              exit 1
            else
              echo "No CRITICAL/HIGH vulnerabilities found"
            fi
          else
            echo "No trivy report found; skipping vulnerability failure step"
          fi

      - name: Sign image with Cosign (keyless, verified)
        # Safest-practical approach: download a pinned cosign release binary and verify its SHA256 checksum
        # from the same GitHub release before executing. Fail if the checksum isn't available or doesn't match.
        run: |
          set -euo pipefail
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          COSIGN_VERSION=2.0.0
          RELEASE_BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          echo "Downloading cosign v${COSIGN_VERSION} from ${RELEASE_BASE}"

          # Try common binary/tarball names
          if curl -fSL -o cosign "${RELEASE_BASE}/cosign-linux-amd64"; then
            echo "Downloaded cosign-linux-amd64"
          elif curl -fSL -o cosign.tar.gz "${RELEASE_BASE}/cosign_${COSIGN_VERSION}_linux_amd64.tar.gz"; then
            echo "Downloaded cosign tarball"
            tar xzf cosign.tar.gz
          else
            echo "Failed to download cosign v${COSIGN_VERSION} binary or tarball from GitHub releases"
            exit 1
          fi

          if [ ! -f cosign ]; then
            echo "No cosign binary present after extraction"
            ls -la || true
            exit 1
          fi

          # Compute local checksum
          LOCAL_SUM=$(sha256sum cosign | awk '{print $1}')
          echo "Local sha256: ${LOCAL_SUM}"

          # Try a few common checksum filenames from GitHub releases
          CHECKSUM_OK=0
          for NAME in "cosign_${COSIGN_VERSION}_checksums.txt" "checksums.txt" "sha256sum.txt" "sha256sums.txt" "SHA256SUMS" "sha256sums"; do
            URL="${RELEASE_BASE}/${NAME}"
            echo "Attempting to fetch checksum file: ${URL}"
            if curl -fsSL -o cosign.SHA256 "${URL}"; then
              if grep -q "${LOCAL_SUM}" cosign.SHA256; then
                echo "Checksum verification passed against ${NAME}"
                CHECKSUM_OK=1
                break
              else
                echo "Checksum file ${NAME} found but did not match local binary"
                cat cosign.SHA256 || true
                exit 1
              fi
            fi
          done

          if [ "${CHECKSUM_OK}" -ne 1 ]; then
            echo "No checksum file matched local cosign binary; refusing to run unverified binary"
            exit 1
          fi

          chmod +x cosign
          echo "Signing ${IMAGE} with cosign (keyless)"
          ./cosign sign --keyless ${IMAGE}

      - name: Pull and run CI inside the signed image
        run: |
          IMAGE=${{ steps.get-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker pull ${IMAGE}
          # run the same CI commands that the Dockerfile CMD would run (pnpm inside image)
          docker run --rm ${IMAGE} sh -c "pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/

